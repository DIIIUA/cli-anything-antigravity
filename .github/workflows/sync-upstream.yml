name: Sync Upstream HKUDS/CLI-Anything

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Sync canonical resources from HKUDS/CLI-Anything
        run: bash scripts/sync-upstream.sh

      - name: Run full regression suite
        run: |
          bash tests/test_install.sh
          python3 -m pytest tests/test_verify_harness.py tests/test_install_race.py -v

      - name: Open sync PR if changes detected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Already up to date with HKUDS/CLI-Anything."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="sync/upstream-$(date -u +%Y%m%d)"
          git checkout -B "${BRANCH}"
          git add references/ scripts/ UPSTREAM_SYNC.json
          git commit -m "chore(sync): update canonical resources from HKUDS/CLI-Anything"
          git push -f origin "${BRANCH}"
          EXISTING="$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')"
          if [[ "${EXISTING}" == "0" ]]; then
            gh pr create \
              --title "chore(sync): update canonical resources from HKUDS/CLI-Anything" \
              --body "Automated upstream sync of canonical methodology and helper scripts from \`HKUDS/CLI-Anything\`." \
              --base main \
              --head "${BRANCH}"
          else
            echo "Open PR already exists for ${BRANCH}."
          fi
