name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-installer-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Antigravity plugin installer (bash)
        run: bash tests/test_install.sh

  test-installer-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Antigravity plugin installer (PowerShell)
        shell: pwsh
        run: ./tests/test_install.ps1
