name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-installer-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and CLI harness deps
        run: python3 -m pip install --quiet pytest click prompt-toolkit

      - name: Test Antigravity plugin installer (bash)
        run: bash tests/test_install.sh

      - name: Test verifier, lister, PEP 420 guard, and install race
        run: python3 -m pytest tests/test_verify_harness.py tests/test_install_race.py -v

      - name: Verify and test bundled cli-anything-antigravity harness (dogfood)
        run: |
          python3 scripts/verify_harness.py harness/antigravity/agent-harness --strict
          python3 -m pip install --no-build-isolation --no-deps -e harness/antigravity/agent-harness
          cli-anything-antigravity --help >/dev/null
          python3 -m pytest harness/antigravity/agent-harness/cli_anything/antigravity/tests/test_core.py -v

  test-installer-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and CLI harness deps
        run: python -m pip install --quiet pytest click prompt-toolkit

      - name: Test Antigravity plugin installer (PowerShell)
        shell: pwsh
        run: ./tests/test_install.ps1

      - name: Test verifier, lister, PEP 420 guard, and install race
        shell: pwsh
        run: python -m pytest tests/test_verify_harness.py tests/test_install_race.py -v

      - name: Verify and test bundled cli-anything-antigravity harness (dogfood)
        shell: pwsh
        run: |
          python scripts/verify_harness.py harness/antigravity/agent-harness --strict
          python -m pip install --no-build-isolation --no-deps -e harness/antigravity/agent-harness
          cli-anything-antigravity --help | Out-Null
          python -m pytest harness/antigravity/agent-harness/cli_anything/antigravity/tests/test_core.py -v
